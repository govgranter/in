<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sender</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }
        .connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Message Sender</h1>
        <p class="subtitle">Send messages to other devices in real-time</p>
        
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Type your message here..." maxlength="200">
        </div>
        
        <button onclick="sendMessage()">Send Message</button>
        
        <div id="status" class="disconnected">🔴 Disconnected from server</div>
    </div>

    <script>
        // Connect to Socket.IO server
        const socket = io();
        const messageInput = document.getElementById('messageInput');
        const status = document.getElementById('status');
        
        // Connection events
        socket.on('connect', () => {
            console.log('✅ Connected to server');
            status.textContent = '🟢 Connected to server - Ready to send messages!';
            status.className = 'status connected';
        });
        
        socket.on('disconnect', () => {
            console.log('❌ Disconnected from server');
            status.textContent = '🔴 Disconnected from server - Unable to send messages';
            status.className = 'status disconnected';
        });
        
        socket.on('connection-established', (data) => {
            console.log('Connection established with ID:', data.id);
        });
        
        // Send message function
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                socket.emit('send-message', message);
                messageInput.value = '';
                messageInput.focus();
                
                // Show temporary success message
                const originalText = status.textContent;
                status.textContent = '✅ Message sent successfully!';
                setTimeout(() => {
                    status.textContent = originalText;
                }, 2000);
            }
        }
        
        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Focus on input when page loads
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
